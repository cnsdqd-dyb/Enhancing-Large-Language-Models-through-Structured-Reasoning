[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-reasoning"
version = "0.1.0"
description = "Training and analysis utilities for Structured Reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24",
  "networkx>=3.2",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.2",
  "datasets>=3.2",
  "torch>=2.2",
  "transformers>=4.46",
]
analysis = ["pandas>=2.0", "pyarrow>=14"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
